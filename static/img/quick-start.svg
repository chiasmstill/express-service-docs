<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Форма регистрации">
  <!-- Фон -->
  <rect width="800" height="400" fill="#f8f9fa" rx="8"/>

  <!-- Имитация браузерной строки -->
  <rect x="0" y="0" width="800" height="36" fill="#e9ecef" rx="8"/>
  <rect x="0" y="20" width="800" height="16" fill="#e9ecef"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <rect x="90" y="8" width="620" height="20" fill="white" rx="4"/>
  <text x="400" y="22" text-anchor="middle" fill="#6c757d" font-family="system-ui" font-size="11">express-service.test/register</text>

  <!-- Карточка регистрации -->
  <rect x="250" y="56" width="300" height="310" fill="white" rx="8" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>

  <!-- Заголовок формы -->
  <text x="400" y="90" text-anchor="middle" fill="#2e8b57" font-family="system-ui" font-size="18" font-weight="bold">Регистрация</text>

  <!-- Поле: Имя -->
  <text x="270" y="122" fill="#495057" font-family="system-ui" font-size="11">Имя и фамилия</text>
  <rect x="270" y="128" width="260" height="32" fill="white" stroke="#ced4da" stroke-width="1.5" rx="4"/>
  <text x="284" y="148" fill="#adb5bd" font-family="system-ui" font-size="12">Иванов Иван</text>

  <!-- Поле: Email -->
  <text x="270" y="178" fill="#495057" font-family="system-ui" font-size="11">Email</text>
  <rect x="270" y="184" width="260" height="32" fill="white" stroke="#ced4da" stroke-width="1.5" rx="4"/>
  <text x="284" y="204" fill="#adb5bd" font-family="system-ui" font-size="12">ivan@example.ru</text>

  <!-- Поле: Пароль -->
  <text x="270" y="234" fill="#495057" font-family="system-ui" font-size="11">Пароль</text>
  <rect x="270" y="240" width="260" height="32" fill="white" stroke="#ced4da" stroke-width="1.5" rx="4"/>
  <text x="284" y="260" fill="#adb5bd" font-family="system-ui" font-size="12">••••••••</text>

  <!-- Кнопка -->
  <rect x="270" y="294" width="260" height="40" fill="#2e8b57" rx="6"/>
  <text x="400" y="318" text-anchor="middle" fill="white" font-family="system-ui" font-size="14" font-weight="bold">Создать аккаунт</text>

  <!-- Ссылка: войти -->
  <text x="400" y="352" text-anchor="middle" fill="#6c757d" font-family="system-ui" font-size="11">Уже есть аккаунт?</text>
  <text x="400" y="366" text-anchor="middle" fill="#2e8b57" font-family="system-ui" font-size="11" text-decoration="underline">Войти</text>

  <!-- Подпись -->
  <text x="400" y="392" text-anchor="middle" fill="#adb5bd" font-family="system-ui" font-size="10">Экспресс сервис — форма регистрации</text>
</svg>
