<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Экран оплаты">
  <!-- Фон -->
  <rect width="800" height="400" fill="#f8f9fa" rx="8"/>

  <!-- Браузерная строка -->
  <rect x="0" y="0" width="800" height="36" fill="#e9ecef" rx="8"/>
  <rect x="0" y="20" width="800" height="16" fill="#e9ecef"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <rect x="90" y="8" width="620" height="20" fill="white" rx="4"/>
  <!-- Замок (HTTPS) -->
  <text x="102" y="22" fill="#2e8b57" font-family="system-ui" font-size="11">🔒</text>
  <text x="420" y="22" text-anchor="middle" fill="#6c757d" font-family="system-ui" font-size="11">express-service.test/payment/ORD-00042</text>

  <!-- Карточка оплаты -->
  <rect x="180" y="56" width="440" height="316" fill="white" rx="8" filter="url(#shp)"/>
  <defs>
    <filter id="shp">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="rgba(0,0,0,0.1)"/>
    </filter>
  </defs>

  <text x="400" y="86" text-anchor="middle" fill="#2e8b57" font-family="system-ui" font-size="17" font-weight="bold">Оплата заказа</text>

  <!-- Сумма -->
  <rect x="200" y="100" width="400" height="52" fill="#f0faf4" rx="6"/>
  <text x="400" y="124" text-anchor="middle" fill="#495057" font-family="system-ui" font-size="12">К оплате</text>
  <text x="400" y="144" text-anchor="middle" fill="#2e8b57" font-family="system-ui" font-size="22" font-weight="bold">490 ₽</text>

  <!-- Способы оплаты -->
  <text x="200" y="178" fill="#6c757d" font-family="system-ui" font-size="11">Выберите способ оплаты</text>

  <!-- Карта (активный) -->
  <rect x="200" y="186" width="400" height="44" fill="white" stroke="#2e8b57" stroke-width="2" rx="6"/>
  <circle cx="225" cy="208" r="10" fill="#2e8b57"/>
  <circle cx="225" cy="208" r="4" fill="white"/>
  <text x="245" y="204" fill="#495057" font-family="system-ui" font-size="12" font-weight="bold">Банковская карта</text>
  <text x="245" y="220" fill="#6c757d" font-family="system-ui" font-size="10">Visa, Mastercard, МИР</text>
  <text x="590" y="212" text-anchor="end" fill="#6c757d" font-family="system-ui" font-size="18">💳</text>

  <!-- СберПей -->
  <rect x="200" y="238" width="400" height="44" fill="white" stroke="#ced4da" stroke-width="1.5" rx="6"/>
  <circle cx="225" cy="260" r="10" fill="white" stroke="#ced4da" stroke-width="1.5"/>
  <text x="245" y="256" fill="#495057" font-family="system-ui" font-size="12">SberPay</text>
  <text x="245" y="272" fill="#6c757d" font-family="system-ui" font-size="10">Быстрая оплата через СберБанк</text>

  <!-- ЮМани -->
  <rect x="200" y="290" width="400" height="44" fill="white" stroke="#ced4da" stroke-width="1.5" rx="6"/>
  <circle cx="225" cy="312" r="10" fill="white" stroke="#ced4da" stroke-width="1.5"/>
  <text x="245" y="308" fill="#495057" font-family="system-ui" font-size="12">ЮМани</text>
  <text x="245" y="324" fill="#6c757d" font-family="system-ui" font-size="10">Электронный кошелёк</text>

  <!-- Кнопка оплатить -->
  <rect x="200" y="344" width="400" height="44" fill="#2e8b57" rx="6"/>
  <text x="400" y="370" text-anchor="middle" fill="white" font-family="system-ui" font-size="15" font-weight="bold">Оплатить 490 ₽</text>

  <!-- Подпись -->
  <text x="400" y="392" text-anchor="middle" fill="#adb5bd" font-family="system-ui" font-size="10">Экспресс сервис — страница оплаты</text>
</svg>
