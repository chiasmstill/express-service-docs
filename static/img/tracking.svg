<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Карта отслеживания посылки">
  <!-- Фон -->
  <rect width="800" height="400" fill="#f8f9fa" rx="8"/>

  <!-- Браузерная строка -->
  <rect x="0" y="0" width="800" height="36" fill="#e9ecef" rx="8"/>
  <rect x="0" y="20" width="800" height="16" fill="#e9ecef"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <rect x="90" y="8" width="620" height="20" fill="white" rx="4"/>
  <text x="400" y="22" text-anchor="middle" fill="#6c757d" font-family="system-ui" font-size="11">express-service.test/track/ORD-20250325-00042</text>

  <!-- Карта (имитация) -->
  <rect x="40" y="50" width="480" height="320" fill="#e8f4ea" rx="8"/>
  <!-- Сетка карты -->
  <line x1="40" y1="130" x2="520" y2="130" stroke="#d4e9d7" stroke-width="1"/>
  <line x1="40" y1="210" x2="520" y2="210" stroke="#d4e9d7" stroke-width="1"/>
  <line x1="40" y1="290" x2="520" y2="290" stroke="#d4e9d7" stroke-width="1"/>
  <line x1="160" y1="50" x2="160" y2="370" stroke="#d4e9d7" stroke-width="1"/>
  <line x1="280" y1="50" x2="280" y2="370" stroke="#d4e9d7" stroke-width="1"/>
  <line x1="400" y1="50" x2="400" y2="370" stroke="#d4e9d7" stroke-width="1"/>

  <!-- Улицы -->
  <rect x="100" y="90" width="340" height="12" fill="#c8e6d0" rx="2"/>
  <rect x="180" y="150" width="200" height="12" fill="#c8e6d0" rx="2"/>
  <rect x="220" y="50" width="12" height="290" fill="#c8e6d0" rx="2"/>
  <rect x="380" y="100" width="12" height="180" fill="#c8e6d0" rx="2"/>

  <!-- Маршрут курьера -->
  <polyline points="120,310 180,260 260,200 340,160 420,130" fill="none" stroke="#2e8b57" stroke-width="3" stroke-dasharray="8,4"/>

  <!-- Точка А: отправитель -->
  <circle cx="120" cy="310" r="10" fill="#2e8b57"/>
  <text x="134" y="306" fill="#2e8b57" font-family="system-ui" font-size="11" font-weight="bold">А</text>
  <text x="134" y="320" fill="#495057" font-family="system-ui" font-size="10">ул. Ленина, 1</text>

  <!-- Точка курьера (текущее положение) -->
  <circle cx="340" cy="160" r="12" fill="white" stroke="#2e8b57" stroke-width="3"/>
  <text x="340" y="164" text-anchor="middle" fill="#2e8b57" font-family="system-ui" font-size="12">🚴</text>
  <rect x="310" y="136" width="120" height="20" fill="white" rx="4" filter="url(#shm)"/>
  <text x="370" y="150" text-anchor="middle" fill="#2e8b57" font-family="system-ui" font-size="10" font-weight="bold">Курьер в пути</text>
  <defs>
    <filter id="shm">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- Точка Б: получатель -->
  <circle cx="420" cy="130" r="10" fill="#dc3545"/>
  <text x="434" y="126" fill="#dc3545" font-family="system-ui" font-size="11" font-weight="bold">Б</text>
  <text x="434" y="140" fill="#495057" font-family="system-ui" font-size="10">пр. Мира, 42</text>

  <!-- Панель статуса -->
  <rect x="540" y="50" width="220" height="320" fill="white" rx="8" filter="url(#shm)"/>
  <text x="560" y="78" fill="#2e8b57" font-family="system-ui" font-size="13" font-weight="bold">Статус заказа</text>
  <text x="650" y="78" text-anchor="end" fill="#6c757d" font-family="system-ui" font-size="10">ORD-00042</text>

  <!-- Прогресс-бар -->
  <circle cx="570" cy="110" r="8" fill="#2e8b57"/>
  <text x="588" y="114" fill="#2e8b57" font-family="system-ui" font-size="11" font-weight="bold">Принят</text>
  <line x1="570" y1="118" x2="570" y2="148" stroke="#2e8b57" stroke-width="2"/>

  <circle cx="570" cy="155" r="8" fill="#2e8b57"/>
  <text x="588" y="159" fill="#2e8b57" font-family="system-ui" font-size="11" font-weight="bold">Забран</text>
  <line x1="570" y1="163" x2="570" y2="193" stroke="#2e8b57" stroke-width="2"/>

  <circle cx="570" cy="200" r="8" fill="white" stroke="#2e8b57" stroke-width="2.5"/>
  <circle cx="570" cy="200" r="4" fill="#2e8b57"/>
  <text x="588" y="204" fill="#2e8b57" font-family="system-ui" font-size="11" font-weight="bold">В пути ←</text>
  <line x1="570" y1="208" x2="570" y2="238" stroke="#ced4da" stroke-width="2" stroke-dasharray="4,3"/>

  <circle cx="570" cy="245" r="8" fill="white" stroke="#ced4da" stroke-width="2"/>
  <text x="588" y="249" fill="#adb5bd" font-family="system-ui" font-size="11">Доставлен</text>

  <line x1="540" y1="270" x2="756" y2="270" stroke="#e9ecef" stroke-width="1"/>
  <text x="560" y="292" fill="#6c757d" font-family="system-ui" font-size="11">Ожидаемое время:</text>
  <text x="560" y="312" fill="#2e8b57" font-family="system-ui" font-size="15" font-weight="bold">17:00</text>
  <text x="610" y="312" fill="#6c757d" font-family="system-ui" font-size="11">сегодня</text>
  <text x="560" y="332" fill="#6c757d" font-family="system-ui" font-size="10">Осталось ≈ 45 мин</text>

  <!-- Подпись -->
  <text x="400" y="392" text-anchor="middle" fill="#adb5bd" font-family="system-ui" font-size="10">Экспресс сервис — отслеживание заказа</text>
</svg>
