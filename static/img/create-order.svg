<svg width="800" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Форма оформления заказа">
  <!-- Фон -->
  <rect width="800" height="420" fill="#f8f9fa" rx="8"/>

  <!-- Браузерная строка -->
  <rect x="0" y="0" width="800" height="36" fill="#e9ecef" rx="8"/>
  <rect x="0" y="20" width="800" height="16" fill="#e9ecef"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <rect x="90" y="8" width="620" height="20" fill="white" rx="4"/>
  <text x="400" y="22" text-anchor="middle" fill="#6c757d" font-family="system-ui" font-size="11">express-service.test/orders/new</text>

  <!-- Форма -->
  <rect x="40" y="52" width="460" height="350" fill="white" rx="8" filter="url(#sh2)"/>
  <defs>
    <filter id="sh2">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>

  <text x="60" y="80" fill="#2e8b57" font-family="system-ui" font-size="16" font-weight="bold">Новый заказ</text>

  <!-- Секция: Отправитель -->
  <text x="60" y="108" fill="#495057" font-family="system-ui" font-size="12" font-weight="bold">Отправитель</text>
  <rect x="60" y="116" width="200" height="28" fill="white" stroke="#ced4da" stroke-width="1.5" rx="4"/>
  <text x="72" y="134" fill="#adb5bd" font-family="system-ui" font-size="11">Имя</text>
  <rect x="278" y="116" width="200" height="28" fill="white" stroke="#ced4da" stroke-width="1.5" rx="4"/>
  <text x="290" y="134" fill="#adb5bd" font-family="system-ui" font-size="11">Телефон</text>

  <rect x="60" y="154" width="418" height="28" fill="white" stroke="#ced4da" stroke-width="1.5" rx="4"/>
  <text x="72" y="172" fill="#adb5bd" font-family="system-ui" font-size="11">Адрес отправителя</text>

  <!-- Секция: Получатель -->
  <text x="60" y="204" fill="#495057" font-family="system-ui" font-size="12" font-weight="bold">Получатель</text>
  <rect x="60" y="212" width="200" height="28" fill="white" stroke="#2e8b57" stroke-width="1.5" rx="4"/>
  <text x="72" y="230" fill="#495057" font-family="system-ui" font-size="11">Петрова Анна</text>
  <rect x="278" y="212" width="200" height="28" fill="white" stroke="#2e8b57" stroke-width="1.5" rx="4"/>
  <text x="290" y="230" fill="#495057" font-family="system-ui" font-size="11">+7-900-765-43-21</text>

  <rect x="60" y="250" width="418" height="28" fill="white" stroke="#2e8b57" stroke-width="1.5" rx="4"/>
  <text x="72" y="268" fill="#495057" font-family="system-ui" font-size="11">Москва, пр. Мира, 42, офис 301</text>

  <!-- Тип доставки -->
  <text x="60" y="304" fill="#495057" font-family="system-ui" font-size="12" font-weight="bold">Тип доставки</text>
  <rect x="60" y="312" width="118" height="34" fill="#2e8b57" rx="6"/>
  <text x="119" y="333" text-anchor="middle" fill="white" font-family="system-ui" font-size="12" font-weight="bold">Экспресс</text>
  <rect x="190" y="312" width="118" height="34" fill="white" stroke="#ced4da" stroke-width="1.5" rx="6"/>
  <text x="249" y="333" text-anchor="middle" fill="#6c757d" font-family="system-ui" font-size="12">Стандарт</text>
  <rect x="320" y="312" width="118" height="34" fill="white" stroke="#ced4da" stroke-width="1.5" rx="6"/>
  <text x="379" y="333" text-anchor="middle" fill="#6c757d" font-family="system-ui" font-size="12">Ночная</text>

  <!-- Вес -->
  <text x="60" y="370" fill="#495057" font-family="system-ui" font-size="11">Вес (кг)</text>
  <rect x="60" y="376" width="100" height="28" fill="white" stroke="#ced4da" stroke-width="1.5" rx="4"/>
  <text x="72" y="394" fill="#495057" font-family="system-ui" font-size="11">1.5</text>

  <!-- Кнопка -->
  <rect x="310" y="368" width="168" height="40" fill="#2e8b57" rx="6"/>
  <text x="394" y="392" text-anchor="middle" fill="white" font-family="system-ui" font-size="13" font-weight="bold">Создать заказ →</text>

  <!-- Сводка справа -->
  <rect x="520" y="52" width="240" height="200" fill="white" rx="8" filter="url(#sh2)"/>
  <text x="540" y="80" fill="#2e8b57" font-family="system-ui" font-size="14" font-weight="bold">Сводка</text>
  <line x1="540" y1="90" x2="740" y2="90" stroke="#e9ecef" stroke-width="1"/>
  <text x="540" y="112" fill="#495057" font-family="system-ui" font-size="11">Тип:</text>
  <text x="720" y="112" text-anchor="end" fill="#2e8b57" font-family="system-ui" font-size="11" font-weight="bold">Экспресс</text>
  <text x="540" y="134" fill="#495057" font-family="system-ui" font-size="11">Вес:</text>
  <text x="720" y="134" text-anchor="end" fill="#495057" font-family="system-ui" font-size="11">1.5 кг</text>
  <text x="540" y="156" fill="#495057" font-family="system-ui" font-size="11">Срок:</text>
  <text x="720" y="156" text-anchor="end" fill="#495057" font-family="system-ui" font-size="11">2–4 часа</text>
  <line x1="540" y1="168" x2="740" y2="168" stroke="#e9ecef" stroke-width="1"/>
  <text x="540" y="188" fill="#495057" font-family="system-ui" font-size="13" font-weight="bold">Итого:</text>
  <text x="720" y="188" text-anchor="end" fill="#2e8b57" font-family="system-ui" font-size="15" font-weight="bold">490 ₽</text>

  <!-- Подпись -->
  <text x="400" y="412" text-anchor="middle" fill="#adb5bd" font-family="system-ui" font-size="10">Экспресс сервис — форма оформления заказа</text>
</svg>
