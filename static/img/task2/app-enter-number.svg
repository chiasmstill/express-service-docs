<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" font-family="system-ui, -apple-system, sans-serif">
  <!-- Phone background -->
  <rect width="390" height="700" rx="40" fill="#f2f2f7"/>

  <!-- Status bar -->
  <rect width="390" height="44" rx="0" fill="#1a5c38"/>
  <text x="24" y="28" fill="white" font-size="13" font-weight="600">9:41</text>
  <text x="340" y="28" fill="white" font-size="13">●●●</text>

  <!-- App header with back button -->
  <rect y="44" width="390" height="60" fill="#1a5c38"/>
  <text x="24" y="82" fill="white" font-size="20">‹</text>
  <text x="195" y="82" fill="white" font-size="18" font-weight="700" text-anchor="middle">Отследить посылку</text>

  <!-- Instruction text -->
  <text x="195" y="150" fill="#444" font-size="14" text-anchor="middle">Введите трек‑номер заказа</text>

  <!-- Input field -->
  <rect x="20" y="166" width="350" height="56" rx="14" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
  <text x="36" y="199" fill="#1a1a1a" font-size="16" font-weight="500" letter-spacing="1">ES-2024-00234</text>
  <rect x="320" y="182" width="4" height="24" fill="#2e8b57"/>

  <!-- Hint under field -->
  <text x="24" y="242" fill="#999" font-size="12">Формат: ES-ГГГГ-XXXXXX · например, ES-2026-00234</text>

  <!-- Search button -->
  <rect x="20" y="262" width="350" height="54" rx="14" fill="#2e8b57"/>
  <text x="195" y="294" fill="white" font-size="16" font-weight="700" text-anchor="middle">Найти</text>

  <!-- Divider -->
  <line x1="20" y1="338" x2="370" y2="338" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="148" y="330" width="94" height="16" rx="8" fill="#f2f2f7"/>
  <text x="195" y="342" fill="#999" font-size="11" text-anchor="middle">Недавние запросы</text>

  <!-- Recent search 1 -->
  <rect x="20" y="354" width="350" height="52" rx="12" fill="#ffffff"/>
  <text x="52" y="373" fill="#999" font-size="18">🕐</text>
  <text x="74" y="373" fill="#1a1a1a" font-size="14" font-weight="500">ES-2024-00231</text>
  <text x="74" y="391" fill="#999" font-size="12">В пути · 29.03.2026</text>
  <text x="354" y="382" fill="#999" font-size="16" text-anchor="end">›</text>

  <!-- Recent search 2 -->
  <rect x="20" y="414" width="350" height="52" rx="12" fill="#ffffff"/>
  <text x="52" y="433" fill="#999" font-size="18">🕐</text>
  <text x="74" y="433" fill="#1a1a1a" font-size="14" font-weight="500">ES-2024-00228</text>
  <text x="74" y="451" fill="#999" font-size="12">Доставлен · 27.03.2026</text>
  <text x="354" y="442" fill="#999" font-size="16" text-anchor="end">›</text>

  <!-- Recent search 3 -->
  <rect x="20" y="474" width="350" height="52" rx="12" fill="#ffffff"/>
  <text x="52" y="493" fill="#999" font-size="18">🕐</text>
  <text x="74" y="493" fill="#1a1a1a" font-size="14" font-weight="500">ES-2024-00217</text>
  <text x="74" y="511" fill="#999" font-size="12">Доставлен · 24.03.2026</text>
  <text x="354" y="502" fill="#999" font-size="16" text-anchor="end">›</text>

  <!-- Bottom nav -->
  <rect y="628" width="390" height="72" fill="#ffffff"/>
  <line x1="0" y1="628" x2="390" y2="628" stroke="#e0e0e0" stroke-width="1"/>
  <text x="49" y="656" fill="#999" font-size="22" text-anchor="middle">🏠</text>
  <text x="49" y="674" fill="#999" font-size="10" text-anchor="middle">Главная</text>
  <text x="147" y="656" fill="#999" font-size="22" text-anchor="middle">📦</text>
  <text x="147" y="674" fill="#999" font-size="10" text-anchor="middle">Заказы</text>
  <text x="245" y="656" fill="#2e8b57" font-size="22" text-anchor="middle">🔍</text>
  <text x="245" y="674" fill="#2e8b57" font-size="10" font-weight="600" text-anchor="middle">Трекинг</text>
  <text x="341" y="656" fill="#999" font-size="22" text-anchor="middle">👤</text>
  <text x="341" y="674" fill="#999" font-size="10" text-anchor="middle">Профиль</text>
</svg>
