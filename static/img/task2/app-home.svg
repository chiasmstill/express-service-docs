<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" font-family="system-ui, -apple-system, sans-serif">
  <!-- Phone background -->
  <rect width="390" height="700" rx="40" fill="#f2f2f7"/>

  <!-- Status bar -->
  <rect width="390" height="44" rx="0" fill="#1a5c38"/>
  <text x="24" y="28" fill="white" font-size="13" font-weight="600">9:41</text>
  <text x="340" y="28" fill="white" font-size="13">●●●</text>

  <!-- App header -->
  <rect y="44" width="390" height="60" fill="#1a5c38"/>
  <text x="195" y="82" fill="white" font-size="18" font-weight="700" text-anchor="middle">Экспресс Сервис</text>

  <!-- Welcome block -->
  <rect x="20" y="124" width="350" height="72" rx="14" fill="#ffffff"/>
  <text x="36" y="150" fill="#1a5c38" font-size="14" font-weight="700">Добро пожаловать, Иван!</text>
  <text x="36" y="170" fill="#666" font-size="13">У вас 2 активных заказа</text>
  <rect x="270" y="136" width="84" height="36" rx="10" fill="#2e8b57"/>
  <text x="312" y="159" fill="white" font-size="12" font-weight="600" text-anchor="middle">Создать</text>

  <!-- Active orders label -->
  <text x="24" y="224" fill="#1a1a1a" font-size="15" font-weight="700">Активные заказы</text>

  <!-- Order card 1 -->
  <rect x="20" y="236" width="350" height="76" rx="14" fill="#ffffff"/>
  <rect x="20" y="236" width="5" height="76" rx="3" fill="#2e8b57"/>
  <text x="38" y="260" fill="#1a1a1a" font-size="14" font-weight="600">ES-2024-00231</text>
  <text x="38" y="278" fill="#666" font-size="12">Экспресс · ул. Ленина → пр. Мира</text>
  <rect x="260" y="247" width="96" height="24" rx="8" fill="#e6f4ee"/>
  <text x="308" y="264" fill="#1a5c38" font-size="11" font-weight="600" text-anchor="middle">В пути</text>
  <text x="38" y="298" fill="#999" font-size="11">Ожидаемое прибытие: 14:30</text>

  <!-- Order card 2 -->
  <rect x="20" y="322" width="350" height="76" rx="14" fill="#ffffff"/>
  <rect x="20" y="322" width="5" height="76" rx="3" fill="#f59e0b"/>
  <text x="38" y="346" fill="#1a1a1a" font-size="14" font-weight="600">ES-2024-00234</text>
  <text x="38" y="364" fill="#666" font-size="12">Стандарт · Складской пр. → Садовая ул.</text>
  <rect x="222" y="333" width="134" height="24" rx="8" fill="#fff8e6"/>
  <text x="289" y="350" fill="#b45309" font-size="11" font-weight="600" text-anchor="middle">Ожидает курьера</text>
  <text x="38" y="384" fill="#999" font-size="11">Создан: 29.03.2026 09:15</text>

  <!-- Track button -->
  <rect x="20" y="424" width="350" height="54" rx="14" fill="#2e8b57"/>
  <text x="195" y="456" fill="white" font-size="15" font-weight="700" text-anchor="middle">🔍  Отследить посылку</text>

  <!-- Divider label -->
  <text x="24" y="510" fill="#1a1a1a" font-size="15" font-weight="700">История заказов</text>

  <!-- History items -->
  <rect x="20" y="522" width="350" height="44" rx="10" fill="#ffffff"/>
  <text x="36" y="549" fill="#666" font-size="13">ES-2024-00228 · Доставлен 27.03.2026</text>
  <text x="344" y="549" fill="#999" font-size="16" text-anchor="end">›</text>

  <rect x="20" y="574" width="350" height="44" rx="10" fill="#ffffff"/>
  <text x="36" y="601" fill="#666" font-size="13">ES-2024-00217 · Доставлен 24.03.2026</text>
  <text x="344" y="601" fill="#999" font-size="16" text-anchor="end">›</text>

  <!-- Bottom nav -->
  <rect y="628" width="390" height="72" fill="#ffffff"/>
  <line x1="0" y1="628" x2="390" y2="628" stroke="#e0e0e0" stroke-width="1"/>
  <text x="49" y="656" fill="#2e8b57" font-size="22" text-anchor="middle">🏠</text>
  <text x="49" y="674" fill="#2e8b57" font-size="10" font-weight="600" text-anchor="middle">Главная</text>
  <text x="147" y="656" fill="#999" font-size="22" text-anchor="middle">📦</text>
  <text x="147" y="674" fill="#999" font-size="10" text-anchor="middle">Заказы</text>
  <text x="245" y="656" fill="#999" font-size="22" text-anchor="middle">🔍</text>
  <text x="245" y="674" fill="#999" font-size="10" text-anchor="middle">Трекинг</text>
  <text x="341" y="656" fill="#999" font-size="22" text-anchor="middle">👤</text>
  <text x="341" y="674" fill="#999" font-size="10" text-anchor="middle">Профиль</text>
</svg>
