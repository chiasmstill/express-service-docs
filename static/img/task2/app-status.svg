<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" font-family="system-ui, -apple-system, sans-serif">
  <!-- Phone background -->
  <rect width="390" height="700" rx="40" fill="#f2f2f7"/>

  <!-- Status bar -->
  <rect width="390" height="44" rx="0" fill="#1a5c38"/>
  <text x="24" y="28" fill="white" font-size="13" font-weight="600">9:41</text>
  <text x="340" y="28" fill="white" font-size="13">●●●</text>

  <!-- App header -->
  <rect y="44" width="390" height="60" fill="#1a5c38"/>
  <text x="24" y="82" fill="white" font-size="20">‹</text>
  <text x="195" y="82" fill="white" font-size="18" font-weight="700" text-anchor="middle">Статус заказа</text>

  <!-- Order number card -->
  <rect x="20" y="120" width="350" height="64" rx="14" fill="#ffffff"/>
  <text x="36" y="146" fill="#999" font-size="12">Трек‑номер</text>
  <text x="36" y="168" fill="#1a1a1a" font-size="18" font-weight="700" letter-spacing="0.5">ES-2024-00234</text>
  <rect x="278" y="134" width="76" height="26" rx="8" fill="#e6f4ee"/>
  <text x="316" y="152" fill="#1a5c38" font-size="11" font-weight="600" text-anchor="middle">В пути</text>

  <!-- Progress steps -->
  <text x="24" y="216" fill="#1a1a1a" font-size="14" font-weight="700">Маршрут</text>

  <!-- Step 1: done -->
  <circle cx="44" cy="244" r="12" fill="#2e8b57"/>
  <text x="44" y="249" fill="white" font-size="13" text-anchor="middle" font-weight="700">✓</text>
  <text x="66" y="249" fill="#1a1a1a" font-size="13" font-weight="500">Принят</text>
  <text x="66" y="264" fill="#999" font-size="11">29.03.2026, 09:15</text>
  <line x1="44" y1="256" x2="44" y2="284" stroke="#2e8b57" stroke-width="2"/>

  <!-- Step 2: done -->
  <circle cx="44" cy="296" r="12" fill="#2e8b57"/>
  <text x="44" y="301" fill="white" font-size="13" text-anchor="middle" font-weight="700">✓</text>
  <text x="66" y="301" fill="#1a1a1a" font-size="13" font-weight="500">Забран курьером</text>
  <text x="66" y="316" fill="#999" font-size="11">29.03.2026, 10:42</text>
  <line x1="44" y1="308" x2="44" y2="336" stroke="#2e8b57" stroke-width="2"/>

  <!-- Step 3: active -->
  <circle cx="44" cy="348" r="12" fill="#2e8b57" stroke="#2e8b57" stroke-width="3"/>
  <circle cx="44" cy="348" r="5" fill="white"/>
  <text x="66" y="353" fill="#1a5c38" font-size="13" font-weight="700">В пути</text>
  <text x="66" y="368" fill="#999" font-size="11">29.03.2026, 11:08 · курьер в дороге</text>
  <line x1="44" y1="360" x2="44" y2="386" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Step 4: pending -->
  <circle cx="44" cy="398" r="12" fill="#e0e0e0"/>
  <text x="66" y="403" fill="#999" font-size="13">Доставлен</text>
  <text x="66" y="418" fill="#bbb" font-size="11">Ожидается к 14:30</text>

  <!-- Courier info -->
  <rect x="20" y="444" width="350" height="68" rx="14" fill="#ffffff"/>
  <text x="36" y="466" fill="#999" font-size="12">Курьер</text>
  <circle cx="312" cy="470" r="20" fill="#e6f4ee"/>
  <text x="312" y="476" fill="#2e8b57" font-size="20" text-anchor="middle">👤</text>
  <text x="36" y="487" fill="#1a1a1a" font-size="14" font-weight="600">Алексей Смирнов</text>
  <text x="36" y="503" fill="#2e8b57" font-size="13">+7-900-555-12-34</text>

  <!-- Notify button -->
  <rect x="20" y="530" width="350" height="52" rx="14" fill="#2e8b57"/>
  <text x="195" y="561" fill="white" font-size="15" font-weight="700" text-anchor="middle">🔔  Уведомить о доставке</text>

  <!-- Bottom nav -->
  <rect y="628" width="390" height="72" fill="#ffffff"/>
  <line x1="0" y1="628" x2="390" y2="628" stroke="#e0e0e0" stroke-width="1"/>
  <text x="49" y="656" fill="#999" font-size="22" text-anchor="middle">🏠</text>
  <text x="49" y="674" fill="#999" font-size="10" text-anchor="middle">Главная</text>
  <text x="147" y="656" fill="#999" font-size="22" text-anchor="middle">📦</text>
  <text x="147" y="674" fill="#999" font-size="10" text-anchor="middle">Заказы</text>
  <text x="245" y="656" fill="#2e8b57" font-size="22" text-anchor="middle">🔍</text>
  <text x="245" y="674" fill="#2e8b57" font-size="10" font-weight="600" text-anchor="middle">Трекинг</text>
  <text x="341" y="656" fill="#999" font-size="22" text-anchor="middle">👤</text>
  <text x="341" y="674" fill="#999" font-size="10" text-anchor="middle">Профиль</text>
</svg>
